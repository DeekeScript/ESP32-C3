  <line x1="652" y1="614" x2="716" y2="614" stroke="#243044" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="728" y="582" width="250" height="64" rx="10" fill="#f4f7fb" stroke="#243044" stroke-width="1.5"/>
  <text x="853" y="608" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="16" fill="#243044">3. 手机 C</text>
