<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" role="img" aria-label="三台手机分别蓝牙连接同一块 Hid，点击和输入排队执行">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e4ebf2" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#243044"/>
    </marker>
  </defs>
  <rect width="1040" height="720" fill="#f7f9fb"/>
  <rect width="1040" height="720" fill="url(#grid)"/>

  <rect x="28" y="28" width="230" height="470" rx="14" fill="#ffffff" stroke="#243044" stroke-width="2"/>
