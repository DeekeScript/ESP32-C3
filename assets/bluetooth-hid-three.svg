  <rect x="804" y="436" width="164" height="42" rx="8" fill="#f4f7fb" stroke="#243044" stroke-width="1.5"/>
  <text x="886" y="463" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" fill="#243044">DeekeScript</text>

